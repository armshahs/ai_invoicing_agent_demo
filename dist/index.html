<body><div class="app" id="app"></div>
<script>
const state={page:'overview',copilot:false,processing:false,processed:false,maker:false,checker:false,exported:false};
const nav=[['dashboard','▦','Dashboard'],['inbox','▣','Inbox'],['processing','✦','AI Processing'],['validation','✓','Validation'],['maker','✎','Maker Review'],['checker','⌘','Checker Review'],['export','↗','ERP Export'],['audit','◷','Audit Trail']];
const invoice={po:'PO-24119',supplier:'Northstar Industrial Supplies',number:'INV-NS-8841',amount:'$18,742.50'};
function badge(s){const map={Received:'received',Processing:'processing',Validation:'validation','Maker Review':'maker','Checker Review':'checker',Completed:'done'};return `<span class="pill ${map[s]||'received'}">${s}</span>`}
function btn(label,action,kind='primary'){return `<button class="btn ${kind}" onclick="${action}">${label}</button>`}
function shell(body,title){return `<div class="shell"><aside class="side"><div class="brand"><span class="brandmark">F</span>FlowLedger</div><div class="nav-label">Workspace</div><nav class="nav">${nav.map(n=>`<button class="${state.page===n[0]?'active':''}" onclick="go('${n[0]}')"><span class="ico">${n[1]}</span>${n[2]}</button>`).join('')}</nav><div class="side-foot"><strong>AP Operations</strong>Production workspace</div></aside><main class="main"><header class="top"><div class="row"><button class="mobile-menu ghost btn" onclick="go('dashboard')">☰</button><div class="crumb">Invoice operations / <b>${title}</b></div></div><div class="top-actions"><input class="search" placeholder="Search invoice, PO or supplier" /><span class="bell">◌</span><span class="avatar">PS</span></div></header><div class="content"><section class="page">${body}</section></div></main></div>${copilot()}<button class="ai-fab" onclick="toggleCopilot()">✦ AI Copilot</button>`}
function copilot(){return state.copilot?`<aside class="card copilot"><div class="copilot-head"><strong>✦ FlowLedger Copilot</strong><button onclick="toggleCopilot()" style="background:none;color:#fff;font-size:18px">×</button></div><div class="copilot-body"><div class="small muted">Context: ${invoice.po} · ${invoice.number}</div><div class="suggestions"><button onclick="ask('freight')">Why was freight flagged?</button><button onclick="ask('variance')">Summarize PO variance</button><button onclick="ask('note')">Draft note to checker</button></div><div class="answer" id="answer">I can explain extracted values, PO matching, and approval history for this invoice.</div></div></aside>`:''}
function overview(){return `<div class="overview"><div class="card hero"><span class="pill processing">AI invoice operations</span><h1>Invoice intelligence, ready for your ERP.</h1><p>Extract, validate, and approve invoices with a traceable maker-checker workflow that keeps your team in control.</p>${btn('Start Demo Journey',"go('inbox')")}<div class="hero-stats"><div><strong>99.2%</strong><span class="muted small">field extraction accuracy</span></div><div><strong>&lt; 2 min</strong><span class="muted small">average handling time</span></div><div><strong>100%</strong><span class="muted small">audit-ready decisions</span></div></div></div><div class="card card-pad section-gap"><div class="row between"><h2>A controlled path to posting</h2><span class="small muted">PO-24119 is ready for your demo</span></div><div class="flow">${['Ingest','Extract','Validate','Maker','Checker','Export'].map((x,i)=>`<div class="flow-item"><div class="flow-icon">${i+1}</div>${x}</div>`).join('')}</div></div><div class="grid benefits"><div class="card benefit"><i>✦</i><h3>AI you can verify</h3><p class="muted">Confidence, source context, and rationale stay with each field.</p></div><div class="card benefit"><i>✓</i><h3>Controls built in</h3><p class="muted">Separate preparation and authorization with clear accountability.</p></div><div class="card benefit"><i>↗</i><h3>Ready for SAP</h3><p class="muted">Mapped data flows cleanly into your ERP with a posted reference.</p></div></div></div>`}
function dashboard(){return `<div class="row between wrap"><div><h1>Good morning, Priya</h1><p class="subtitle">Here is what needs attention in accounts payable today.</p></div>${btn('Open inbox',"go('inbox')",'secondary')}</div><div class="grid metric-grid">${[['Invoices awaiting action','24','+12% this week','▣'],['AI processing','8','2 completing soon','✦'],['Review exceptions','5','Needs human review','!'],['Straight-through rate','96.8%','+3.2% this month','↗']].map(x=>`<div class="card metric"><div class="metric-top"><span>${x[0]}</span><span class="metric-icon">${x[3]}</span></div><strong>${x[1]}</strong><span class="trend">${x[2]}</span></div>`).join('')}</div><div class="grid split section-gap"><div class="card card-pad"><div class="row between"><h2>Invoice workload</h2><span class="small muted">This week</span></div><div class="mini-bars">${[42,67,50,90,63,77,55].map((h,i)=>`<div class="bar" style="height:${h}%" data-day="${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}"></div>`).join('')}</div></div><div class="card card-pad"><div class="row between"><h2>Needs attention</h2>${badge('Validation')}</div><div class="queue"><div class="queue-item"><div class="docicon">▤</div><div class="grow"><div class="name">PO-24119</div><div class="small muted">Northstar · $60 freight variance</div></div>${btn('Review',"go('validation')",'secondary')}</div><div class="queue-item"><div class="docicon">▤</div><div class="grow"><div class="name">PO-24131</div><div class="small muted">Tensile Labs · supplier match</div></div></div></div></div></div><div class="grid split section-gap"><div class="card card-pad"><h2>Workflow snapshot</h2><div class="steps"><div class="step completed"><i>✓</i>Ingest</div><span class="connector"></span><div class="step completed"><i>✓</i>Extract</div><span class="connector"></span><div class="step current"><i>3</i>Validate</div><span class="connector"></span><div class="step"><i>4</i>Approve</div></div></div><div class="card card-pad"><h2>Recent activity</h2><div class="timeline"><div class="time-item"><b>PO-24118 posted to SAP</b><div class="small muted">8 minutes ago · AP Automation</div></div><div class="time-item"><b>Invoice INV-CL-1002 assigned to you</b><div class="small muted">22 minutes ago</div></div></div></div></div>`}
function inbox(){let others=[['PO-24121','Apex Components','INV-AP-1762','$9,281.00','Received'],['PO-24118','Vertex Machinery','INV-VM-9012','$42,190.75','Completed'],['PO-24131','Tensile Labs','TL-41088','$6,840.00','Validation']];return `<div class="row between wrap"><div><h1>Purchase order inbox</h1><p class="subtitle">New invoices matched to open purchase orders.</p></div>${badge('Received')}</div><div class="card toolbar"><span>⌕</span><input placeholder="Search purchase order or supplier"/><button class="filter">All statuses ▾</button><button class="filter">Due date ▾</button></div><div class="grid inbox-layout"><div class="invoice-list"><div class="card invoice-card selected" onclick="selectInvoice()"><div class="docicon">▤</div><div><div class="name">${invoice.po} <span class="small muted">· ${invoice.number}</span></div><div class="small muted">${invoice.supplier} · Due 18 Oct 2026</div></div><div class="hide-sm amount">${invoice.amount}</div><div class="hide-sm">${badge('Received')}</div>${btn('Process',"startProcessing()",'secondary')}</div>${others.map(i=>`<div class="card invoice-card"><div class="docicon">▤</div><div><div class="name">${i[0]} <span class="small muted">· ${i[2]}</span></div><div class="small muted">${i[1]} · Due 21 Oct 2026</div></div><div class="hide-sm amount">${i[3]}</div><div class="hide-sm">${badge(i[4])}</div><button class="btn secondary">View</button></div>`).join('')}</div><aside class="card side-detail"><div class="row between"><h2>${invoice.po}</h2>${badge('Received')}</div><div class="invoice-preview"><div class="row between"><b>Northstar</b><span class="small muted">Invoice</span></div><div class="paperline"></div><div class="paperline short"></div><div class="paperline"></div><div class="row between" style="margin-top:22px"><b>Total due</b><b>$18,742.50</b></div></div><div class="kv"><span>PO total</span><b>$18,950.00</b></div><div class="kv"><span>Terms</span><b>Net 30</b></div><div class="kv"><span>Attachments</span><b>2 files</b></div><div style="margin-top:17px">${btn('Start AI Processing',"startProcessing()")}</div></aside></div>`}
function process(){let inprog=state.processing&&!state.processed;return `<div class="row between wrap"><div><h1>AI processing</h1><p class="subtitle">${invoice.number} · ${invoice.supplier}</p></div>${badge(inprog?'Processing':'Validation')}</div><div class="steps"><div class="step completed"><i>✓</i>Inbox</div><span class="connector"></span><div class="step current"><i>2</i>AI Processing</div><span class="connector"></span><div class="step"><i>3</i>Validation</div><span class="connector"></span><div class="step"><i>4</i>Approval</div></div><div class="grid process-layout"><div class="card doc-view"><div class="doc-paper"><div class="row between"><h3>NORTHSTAR</h3><span class="small muted">Invoice</span></div><div class="rule"></div><div class="small muted">Invoice number</div><b>INV-NS-8841</b><div class="rule"></div><div class="row between"><span>Manufacturing supplies</span><b>$17,850.00</b></div><div class="row between"><span>GST</span><b>$892.50</b></div><div class="row between"><span>Freight</span><b>$210.00</b></div><div class="rule"></div><div class="row between"><b>Total due</b><b>$18,742.50</b></div></div></div><div class="card extract"><div class="row between"><div><h2>${inprog?'Reading invoice data':'Extraction complete'}</h2><p class="small muted">${inprog?'AI is matching this document against PO-24119.':'All fields captured with source-linked confidence.'}</p></div><span class="pill ${inprog?'processing':'done'}">${inprog?'Live':'Ready'}</span></div>${inprog?'<div class="scanner"></div>':''}<div class="checklist">${[['OCR and document classification',true],['Supplier identity matched',true],['PO line items matched',!inprog],['Tax verification complete',!inprog]].map(x=>`<div class="check"><span class="tick">${x[1]?'✓':'…'}</span><span>${x[0]}</span></div>`).join('')}</div><div class="field-grid"><div class="field"><label>Supplier</label><strong>Northstar Industrial</strong><span class="pill confidence">99% confident</span></div><div class="field"><label>Invoice date</label><strong>01 Oct 2026</strong><span class="pill confidence">98% confident</span></div><div class="field"><label>PO number</label><strong>PO-24119</strong></div><div class="field"><label>Total amount</label><strong>$18,742.50</strong></div></div>${!inprog?`<div style="margin-top:20px">${btn('Continue to validation',"go('validation')")}</div>`:''}</div></div>`}
function validation(){return `<div class="row between wrap"><div><h1>Business validation</h1><p class="subtitle">Review AI-extracted values against the invoice and purchase order.</p></div>${badge('Validation')}</div><div class="grid validation-layout"><div class="card highlight-doc"><div class="doc-paper" style="height:395px;transform:rotate(-1deg)"><div class="row between"><h3>NORTHSTAR</h3><span class="small muted">INV-NS-8841</span></div><div class="rule"></div><div class="row between"><span>Manufacturing supplies</span><b>$17,850.00</b></div><div class="highlight-box"><div class="small muted">Freight charge</div><b>$210.00</b><div class="small" style="color:#b45309">PO allowance: $150.00</div></div><div class="rule"></div><div class="row between"><b>Total due</b><b>$18,742.50</b></div></div></div><div><div class="card card-pad"><div class="row between"><h2>Extracted fields</h2><span class="pill confidence">11 verified</span></div><div class="field-grid"><div class="field"><label>Supplier</label><strong>Northstar Industrial Supplies</strong></div><div class="field"><label>Invoice date</label><strong>01 Oct 2026</strong></div><div class="field"><label>Subtotal</label><strong>$17,850.00</strong></div><div class="field"><label>GST</label><strong>$892.50</strong></div></div><div class="notice"><b>Freight needs review</b><br/><span class="small">Invoice freight is $210.00, $60.00 above the PO allowance. AI found a matching carrier surcharge on the delivery docket.</span><div style="margin-top:9px">${btn('View AI rationale',"toast('AI rationale: surcharge is supported by the delivery docket.')",'secondary')}</div></div><div class="row between"><span class="small muted">11 fields verified · 1 exception</span>${btn('Continue to Maker Review',"go('maker')")}</div></div></div></div>`}
function maker(){return `<div class="row between wrap"><div><h1>Maker review</h1><p class="subtitle">Confirm coding and document the variance before checker approval.</p></div>${badge('Maker Review')}</div><div class="grid review-grid"><div><div class="card approval-card"><div class="row between"><h2>Review summary</h2><span class="pill confidence">AI verified</span></div><div class="notice"><b>Freight variance acknowledged</b><br/><span class="small">$210.00 invoice freight versus $150.00 PO allowance. Delivery docket supports the $60.00 surcharge.</span></div><div class="field-grid"><div><label class="small muted">Cost centre</label><input class="input-field" value="CC-4102 Operations" /></div><div><label class="small muted">GL account</label><input class="input-field" value="520100 Freight & Delivery" /></div></div><label class="attest"><input type="checkbox" checked /> <span>I confirm the invoice, PO match, and coding are accurate for approval.</span></label><div class="row between"><span class="small muted">Maker: Priya Shah</span>${btn(state.maker?'Sent to checker':'Approve for checker',"approveMaker()",'success')}</div></div></div><div><div class="card approval-card"><h2>Invoice and PO</h2><div class="comparison"><div class="compare-cell"><div class="small muted">Invoice total</div><b>$18,742.50</b></div><div class="compare-cell"><div class="small muted">PO remaining</div><b>$18,950.00</b></div></div><div class="kv"><span>Supplier match</span><span class="pill confidence">Matched</span></div><div class="kv"><span>Line items</span><span class="pill confidence">Matched</span></div></div><div class="card approval-card"><h3>Decision note</h3><p class="muted small">Freight surcharge was confirmed against the delivery docket. Coding updated to the freight GL.</p></div></div></div>`}
function checker(){return `<div class="row between wrap"><div><h1>Checker approval</h1><p class="subtitle">Authorize the reviewed invoice for ERP export.</p></div>${badge('Checker Review')}</div><div class="grid review-grid"><div><div class="card approval-card"><div class="row between"><h2>Approval checklist</h2><span class="pill ${state.maker?'done':'validation'}">${state.maker?'Maker approved':'Awaiting maker'}</span></div><div class="checklist">${['PO match confirmed','Freight exception justified','Coding reviewed','Maker attestation verified'].map((x,i)=>`<div class="check"><span class="tick">${state.maker||i<2?'✓':'…'}</span>${x}</div>`).join('')}</div><div class="signature"><div class="small muted">Digital signature</div><div class="sig-name">Priya Shah</div><div class="row between"><span class="pill done">Certificate verified</span><span class="small muted">01 Oct 2026 · 10:42 IST</span></div></div><div class="row" style="margin-top:18px">${btn('Approve & authorize ERP export',"approveChecker()",'success')}${btn('Return to maker',"go('maker')",'secondary')}</div></div></div><div><div class="card approval-card"><h2>Immutable comparison</h2><div class="kv"><span>Invoice total</span><b>$18,742.50</b></div><div class="kv"><span>PO total</span><b>$18,950.00</b></div><div class="kv"><span>Variance</span><span class="pill validation">$60.00 freight</span></div><div class="kv"><span>Prepared by</span><b>Priya Shah</b></div></div><div class="card approval-card"><h3>AI context</h3><p class="small muted">The delivery docket contains a carrier fuel surcharge that accounts for the $60.00 difference.</p></div></div></div>`}
function exportPage(){return `<div class="row between wrap"><div><h1>ERP export</h1><p class="subtitle">Send the approved invoice to your production finance system.</p></div>${badge(state.exported?'Completed':'Checker Review')}</div><div class="card export-hero"><div class="row between wrap"><div><span class="pill ${state.exported?'done':'processing'}">${state.exported?'Posted to ERP':'Ready to export'}</span><h2 style="margin-top:12px">${state.exported?'Invoice posted successfully':'Approval trail complete'}</h2><p class="muted">${state.exported?'SAP document 5100027814 · Posted 01 Oct 2026, 10:44 IST':'Both approval roles have authorized this invoice.'}</p></div>${state.exported?btn('View Audit Trail',"go('audit')",'secondary'):btn('Push to ERP',"pushERP()")}</div>${!state.exported?'<div class="progress"><span id="exportProgress"></span></div>':''}</div><div class="grid export-layout"><div class="card card-pad"><h2>Destination</h2><div class="sap"><div class="sap-logo">SAP</div><div><b>S/4HANA · Production</b><div class="small muted">Vendor invoice posting</div></div><span class="pill done" style="margin-left:auto">Connected</span></div><div class="kv"><span>Company code</span><b>1000</b></div><div class="kv"><span>Document type</span><b>KR</b></div><div class="kv"><span>Posting date</span><b>01 Oct 2026</b></div></div><div class="card card-pad"><h2>Mapped fields</h2><div class="kv"><span>Vendor ID</span><b>100384</b></div><div class="kv"><span>Reference</span><b>INV-NS-8841</b></div><div class="kv"><span>Amount</span><b>$18,742.50</b></div><div class="kv"><span>Cost centre</span><b>CC-4102</b></div></div></div>`}
function audit(){let entries=[['10:44 IST','AP Automation','Posted to SAP S/4HANA','Document 5100027814 created'],['10:42 IST','Priya Shah','Checker signature verified','Certificate validation attached'],['10:38 IST','Priya Shah','Maker approval completed','Freight exception acknowledged'],['10:33 IST','FlowLedger AI','Business validation flagged freight','Invoice +$60.00 vs PO allowance'],['10:31 IST','FlowLedger AI','Extraction completed','11 fields verified from source'],['10:29 IST','AP Operations','Invoice received','Northstar Industrial Supplies']];return `<div class="row between wrap"><div><h1>Audit trail</h1><p class="subtitle">A complete, tamper-evident history for ${invoice.po}.</p></div>${btn('Export audit log',"toast('Audit log prepared for download.')",'secondary')}</div><div class="grid audit-layout"><div class="card audit">${entries.map((e,i)=>`<div class="audit-entry"><div class="audit-dot"></div><div><b>${e[2]}</b><div class="small muted">${e[1]} · ${e[3]}</div></div><span class="small muted">${e[0]}</span></div>`).join('')}</div><aside><div class="card card-pad"><span class="pill done">Complete</span><h2 style="margin-top:12px">SAP document 5100027814</h2><p class="muted">This invoice was posted with its source, AI rationale, coding changes, and both approvals preserved.</p><div class="kv"><span>PO</span><b>PO-24119</b></div><div class="kv"><span>Invoice</span><b>INV-NS-8841</b></div><div class="kv"><span>Hash</span><b class="small">a4c9…7e21</b></div></div></aside></div>`}
function render(){let pages={overview,dashboard,inbox,processing:process,validation,maker,checker,export:exportPage,audit};document.getElementById('app').innerHTML=shell(pages[state.page](),state.page==='overview'?'Welcome':nav.find(n=>n[0]===state.page)?.[2]||'Workspace')}
function go(p){state.page=p;render();window.scrollTo({top:0,behavior:'smooth'})}function selectInvoice(){toast('PO-24119 selected')}
function startProcessing(){state.page='processing';state.processing=true;state.processed=false;render();setTimeout(()=>{state.processing=false;state.processed=true;state.page='validation';render();toast('AI processing complete. Ready for validation.')},3300)}
function approveMaker(){state.maker=true;toast('Maker approval recorded. Sending to checker.');setTimeout(()=>go('checker'),450)}function approveChecker(){if(!state.maker){toast('Maker approval is required first.');return}state.checker=true;toast('Checker approval verified. ERP export is ready.');setTimeout(()=>go('export'),450)}function pushERP(){state.exported=true;render();toast('Posted to SAP S/4HANA. Document 5100027814 created.')}function toggleCopilot(){state.copilot=!state.copilot;render()}function ask(q){let a={freight:'Freight was flagged because $210.00 exceeds the PO allowance by $60.00. The delivery docket supports a carrier surcharge.',variance:'The PO has $18,950.00 available. The invoice is $18,742.50, including the $60.00 freight variance.',note:'Draft note: Freight surcharge verified against the delivery docket. Coding updated to GL 520100 for checker review.'};document.getElementById('answer').textContent=a[q]}function toast(t){let el=document.createElement('div');el.className='toast';el.textContent=t;document.body.append(el);setTimeout(()=>el.remove(),2800)}render();
</script></body></html>
